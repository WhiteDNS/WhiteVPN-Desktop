version: 2
updates:
  - package-ecosystem: gomod
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /WhitednsTC/engine
    schedule:
      interval: weekly
    groups:
      engine-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
