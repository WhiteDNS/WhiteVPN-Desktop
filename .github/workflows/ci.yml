name: CI

# Every release so far was built without a single automated test running: the
# only workflow was the release one, and it fires on a tag. The tests existed and
# were good; whether they had been run depended on somebody remembering to. This
# is that somebody.
#
# On pull requests and on main, so a change is checked before it is merged and
# again after — a green PR that goes red once merged is worth knowing about
# immediately rather than at the next release.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A second push to a branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because a good deal of this code only exists on one of them
        # — the system proxy, the tunnel, elevation — and a test that only ever
        # runs on the developer's machine is a test for that machine. Several
        # tests skip themselves off their own platform, which is exactly why the
        # other platforms have to be here.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: desktop/go.sum

      # WebKit and GTK, which the Wails bindings need to compile on Linux.
      # Without them the build fails for want of a header rather than for
      # anything to do with the change under test.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which is a build artifact and is not in the
      # repository — so `go build` fails on a fresh checkout for want of a
      # directory that only exists after the frontend has been built. It passed
      # on the machine this was written on because that machine had one left
      # over, which is the exact class of thing CI is for, and this was the first
      # thing it caught.
      #
      # A placeholder rather than a real frontend build: this job compiles Go and
      # runs Go tests, and what is inside the bundle makes no difference to
      # either. The frontend job below builds it properly, and the release
      # workflow ships what that produces.
      - name: Placeholder for the embedded frontend
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci placeholder</title>' > frontend/dist/index.html

      - name: Build
        working-directory: desktop
        run: go build ./...

      - name: Vet
        working-directory: desktop
        run: go vet ./internal/... .

      # -race on Linux only: it is the slowest of the three and the concurrency
      # this app has — the health watchdog, the traffic sampler, the seeding —
      # is not platform-specific, so running it once is enough to catch it.
      - name: Test
        working-directory: desktop
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./internal/... .

      # The macOS proxy rules rest on two claims about `networksetup` that Apple
      # does not document: whether the server address survives switching the
      # proxy off, and whether the bypass list can be read back at all. Both were
      # settled by reading its behaviour out of our own source, because there is
      # no Mac here to ask.
      #
      # A hosted runner is a real Mac that can be asked, and it is the only place
      # this belongs: the test reconfigures the machine's own network settings,
      # and an ephemeral runner is where being wrong about the restore costs
      # nothing. It is skipped everywhere else unless the variable is set by hand.
      - name: Ask a real Mac about its proxy settings
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          WHITEVPN_SYSPROXY_INTEGRATION: "1"
        run: go test -v -run OnARealMac ./internal/sysproxy/

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: desktop/go.sum

      # The platform-specific files are the ones most likely to be broken by a
      # change made elsewhere, and they are invisible until something builds for
      # that platform. This catches a Windows-only or Linux-only file that no
      # longer compiles without waiting for a release to find out.
      - name: Build the platform packages for every target
        working-directory: desktop
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./internal/...
          done

  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: desktop/go.sum

      # The engine is the one part of this system nothing automated ever
      # touched. It is built from pinned mihomo and FlClash sources at package
      # time, ships as a separate binary, and carries every byte of a user's
      # traffic — and the five tests that talk to a real one skipped in CI,
      # silently, because the binary was never there to talk to.
      #
      # That made a green tick on an engine version bump mean nothing about the
      # engine. The tests exist and are good; they just had nothing to run
      # against.
      #
      # Keyed on the setup script because that is where the versions are pinned,
      # so moving MIHOMO_TAG or either commit rebuilds instead of quietly
      # testing the old engine against the new pins — which would be worse than
      # not testing at all.
      - name: Cache the engine sources and binary
        uses: actions/cache@v6
        with:
          path: |
            desktop/third_party/flclash
            desktop/cores
          key: engine-${{ runner.os }}-${{ hashFiles('desktop/scripts/setup-mihomo-core.sh', 'desktop/scripts/build-mihomo-core.sh', 'desktop/scripts/patches/*.patch') }}

      - name: Build the engine
        working-directory: desktop
        run: make mihomo-core TARGET_GOOS=linux TARGET_GOARCH=amd64

      # Proves the binary is the one the tests will find, and says which version
      # was built — so a log from a failed run identifies the engine without
      # anyone having to work it out from the pins.
      - name: Report what was built
        working-directory: desktop
        run: |
          set -euo pipefail
          ls -l cores/
          ./cores/mihomo-linux-amd64 -v || true

      # -run is deliberately absent: this runs the engine package's whole suite,
      # so the tests that were skipping are simply no longer skipping.
      - name: Test against the real engine
        working-directory: desktop
        run: go test -v ./internal/engine/

      # Whether the Linux tunnel actually comes up rests on two things nobody
      # here can try by hand: that CAP_NET_ADMIN by way of a root process lets
      # mihomo create the adapter, and that `ip route get` reads back correctly
      # from whatever mechanism mihomo used to install its routes. The comment
      # on TunOptions.StrictRoute says that is "unreachable policy rules" on
      # Linux rather than routes attached to the device the way Windows does
      # it — so a plain `ip route show dev` could easily be asking the wrong
      # question and answering it confidently.
      #
      # A hosted Linux runner is a real Linux machine, so it is asked directly.
      # Run as root rather than through pkexec: pkexec needs a polkit agent and
      # an interactive session a runner has neither of, but elevate_linux.go
      # already takes a direct path when the caller is root, which is the same
      # code a desktop session reaches once its own prompt is answered.
      #
      # Compiled unprivileged and only then run under sudo, so root never needs
      # its own module cache or network access — it gets a finished binary with
      # nothing left to fetch or build.
      - name: Ask a real Linux machine whether the tunnel comes up
        working-directory: desktop
        env:
          WHITEVPN_TUN_INTEGRATION: "1"
        run: |
          go test -c -o /tmp/whitevpn-tun-integration ./internal/engine/
          # From the package's own directory, because corePath resolves the
          # engine binary relative to it (../../cores). `go test` sets that
          # working directory itself; a compiled binary run from anywhere else
          # looks for the core outside the repository and skips for want of it,
          # which reads as a pass.
          cd internal/engine
          sudo --preserve-env=WHITEVPN_TUN_INTEGRATION /tmp/whitevpn-tun-integration -test.v -test.run OnARealLinuxMachine


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install
        working-directory: desktop/frontend
        run: npm ci

      # The type check is the one that has caught real mistakes: a binding added
      # in Go and not in wails.ts, a translation key used before it exists.
      - name: Type check
        working-directory: desktop/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: desktop/frontend
        run: npm run build

  secrets:
    name: No secrets in source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The catalogue's key sat in a public file from the first commit until it
      # was moved into the build. Nothing stopped it going back except noticing,
      # so this notices.
      - name: The catalogue credentials must come from the build, not the source
        run: |
          set -euo pipefail
          # Tests are excluded: one of them sets the address to a stand-in so it
          # can check the real one never reaches the saved state, which is the
          # opposite of the mistake being looked for.
          if grep -rnE 'whiteDNSVPNSubscription(Key|URL)[[:space:]]*=[[:space:]]*"[^"]+"' desktop \
              --include='*.go' --exclude='*_test.go'; then
            echo "::error::A catalogue URL or key is hard-coded above. They are injected at link time; see desktop/Makefile."
            exit 1
          fi
          echo "clean"
